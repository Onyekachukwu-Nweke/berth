name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "stable"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mountabo
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MOUNTABO_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/mountabo?sslmode=disable
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: backend/go.sum

      - name: download modules
        run: go mod download

      - name: verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: test
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

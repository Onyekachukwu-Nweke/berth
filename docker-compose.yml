# Berth, hosted. One Postgres, the Go API on a private network, and the web
# app as the only thing published. Put your TLS reverse proxy (Caddy, nginx,
# a load balancer) in front of port 4321.
#
#   cp .env.example .env   # fill in, including BERTH_MASTER_KEY + POSTGRES_PASSWORD
#   docker compose up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: berth
      POSTGRES_USER: berth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berth -d berth"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://berth:${POSTGRES_PASSWORD}@postgres:5432/berth?sslmode=disable
      BERTH_MASTER_KEY: ${BERTH_MASTER_KEY:?set BERTH_MASTER_KEY in .env}
      BERTH_HTTP_ADDR: ":7778"
      GITHUB_APP_ID: ${GITHUB_APP_ID:?set GITHUB_APP_ID in .env}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:?set GITHUB_APP_PRIVATE_KEY in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
      BERTH_ADMINS: ${BERTH_ADMINS:?set BERTH_ADMINS in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BERTH_AI_MODEL: ${BERTH_AI_MODEL:-}
    # Not published: only the web app reaches it, over the compose network.

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      BERTH_BACKEND: http://api:7778
      # The URL people open Berth at; OAuth redirects are built from it.
      BERTH_PUBLIC_URL: ${BERTH_PUBLIC_URL:?set BERTH_PUBLIC_URL in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
    ports:
      - "${BERTH_WEB_PORT:-4321}:4321"

volumes:
  pgdata:
